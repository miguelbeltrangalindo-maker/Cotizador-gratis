services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cotizador
    ports:
      - "5432:5432"
    volumes:
      - cotizador_pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cotizador"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cotizador_pgdata:
